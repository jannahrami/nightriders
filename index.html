<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jeddah Ride</title>
  <meta name="description" content="تطبيق مجموعة Jeddah Ride الخاصة للطلعات الليلية">
  <meta name="theme-color" content="#07080d">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jeddah Ride">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div id="net-banner" class="net-banner" hidden></div>
  <div id="preview-banner" class="preview-banner" hidden>وضع المعاينة — بيانات تجريبية غير حقيقية ولا تُحفظ</div>
  <div id="app" class="app" aria-live="polite">
    <div class="boot">
      <img class="brand-logo" src="assets/img/logo-full.png" alt="Jeddah Ride">
      <div class="spinner" role="status" aria-label="جارٍ التحميل"></div>
    </div>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px;color:#fff">يحتاج التطبيق إلى تفعيل JavaScript.</p></noscript>
  <script src="config.js" onerror="window.NR_CONFIG_MISSING=true"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
